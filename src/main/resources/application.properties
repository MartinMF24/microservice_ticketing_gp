spring.application.name=microservice-ticketing-gp

# Puerto dinámico (default 8083 en local para evitar conflicto con backend principal en 8080, hoteles en 8081 y vuelos en 8082)
server.port=${PORT:8083}

# ===============================================
# Configuración de Base de Datos (Supabase PostgreSQL)
# Soporta variables de entorno para despliegue y mantiene defaults locales
# Modo de Transacciones via Supavisor Pooler (puerto 6543)
# ===============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.zprznayvpeijjoiknird}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:uade123uade}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================================
# Configuración del Pool de Conexiones (HikariCP)
# ===============================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:60000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.pool-name=TicketingHikariPool
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ===============================================
# Configuración de JPA / Hibernate
# ===============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================================
# Configuración Cliente SOAP - F1 Ticketing Legacy
# Soporta TICKETING_WSDL_URL y TICKETING_SOAP_ENDPOINT_URL
# ===============================================
ticketing.soap.wsdl-url=${TICKETING_WSDL_URL:http://localhost:8080/ws/ticketing.wsdl}
ticketing.soap.endpoint-url=${TICKETING_SOAP_ENDPOINT_URL:http://localhost:8080/ws/ticketing}
ticketing.soap.connect-timeout=${TICKETING_SOAP_CONNECT_TIMEOUT:10000}
ticketing.soap.read-timeout=${TICKETING_SOAP_READ_TIMEOUT:20000}
ticketing.soap.fallback-enabled=${TICKETING_SOAP_FALLBACK_ENABLED:true}

# ===============================================
# Configuración de Sincronización Programada (CRON Diario)
# Expresión por defecto: 0 0 3 * * ? (todos los días a las 03:00 AM UTC)
# ===============================================
ticketing.sync.cron.enabled=${TICKETING_CRON_ENABLED:true}
ticketing.sync.cron.expression=${TICKETING_CRON_EXPRESSION:0 0 3 * * ?}
ticketing.sync.cron.timezone=${TICKETING_CRON_TIMEZONE:UTC}

